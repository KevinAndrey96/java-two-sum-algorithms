name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ "17", "21", "25" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Compile with -Werror, test and package
        run: mvn -B verify

      - name: Command line smoke test
        run: |
          java -jar target/two-sum.jar 9 2 7 11 15 | tee output.txt
          test "$(grep -c 'índices 0 y 1 (2 + 7)' output.txt)" -eq 3
          if java -jar target/two-sum.jar 100 1 2 3; then exit 1; fi
          java -jar target/two-sum.jar --aleatorio 20000 -1 1 | grep -q "sin solución"
